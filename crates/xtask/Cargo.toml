[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Project automation: `cargo dist` (installer), `cargo xtask icons`, `cargo xtask backgrounds`"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lb-gfx = { version = "0.1.0", path = "../lb-gfx" }
lb-media = { version = "0.1.0", path = "../lb-media" }
resvg = "0.48.1"
serde_json = "1.0.154"
toml = "1.1.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
