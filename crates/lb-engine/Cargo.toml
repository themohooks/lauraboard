[package]
name = "lb-engine"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
lb-core = { version = "0.2.0", path = "../lb-core" }
lb-gfx = { version = "0.2.0", path = "../lb-gfx" }
lb-media = { version = "0.2.0", path = "../lb-media" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk", "network"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
sha2 = "0.10.9"
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
