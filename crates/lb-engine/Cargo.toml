[package]
name = "lb-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
lb-core = { version = "0.1.0", path = "../lb-core" }
lb-gfx = { version = "0.1.0", path = "../lb-gfx" }
lb-media = { version = "0.1.0", path = "../lb-media" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
