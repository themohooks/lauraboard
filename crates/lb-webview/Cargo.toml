[package]
name = "lb-webview"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lauraboard-webview"
path = "src/main.rs"

[dependencies]
wry = "0.57.1"
tao = "0.35.3"
serde_json = "1.0.154"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSDictionary"] }
block2 = "0.6"
