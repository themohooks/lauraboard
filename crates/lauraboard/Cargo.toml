[package]
name = "lauraboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = { version = "7.0.0", optional = true }
lb-api = { workspace = true }
lb-core = { workspace = true }
lb-engine = { workspace = true }
lb-gfx = { workspace = true }
lb-gui = { workspace = true, optional = true }
lb-media = { workspace = true }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
lb-winres = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["gui"]
gui = ["dep:lb-gui", "dep:dirs", "dep:rfd"]
