[package]
name = "lb-android"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
lb-gui = { path = "../lb-gui" }
slint = { version = "1.18.1", default-features = false, features = ["backend-android-activity-06", "compat-1-2"] }
stacker = "0.1"

