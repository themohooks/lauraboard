android:
  gradle: false
  manifest:
    package: org.lauraboard.android.experimental
    compile_sdk_version: 35
    sdk:
      min_sdk_version: 26
      # Native xbuild stage only. package-debug.ps1 uses AndroidManifest.xml
      # for the final SDK 35 APK with explicit LAN HTTP support.
      target_sdk_version: 27
    uses_permission:
      - name: android.permission.INTERNET
    application:
      label: LauraBoard Experimental
      has_code: false
      activities:
        - name: android.app.NativeActivity
          exported: true
          orientation: landscape
          config_changes: orientation|keyboardHidden|screenSize
          window_soft_input_mode: adjustResize
