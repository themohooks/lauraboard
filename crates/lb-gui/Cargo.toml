[package]
name = "lb-gui"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
lb-core = { version = "0.2.0", path = "../lb-core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# update downloads are checked against the release's SHA256SUMS
sha2 = "0.10.9"
# winit access: the popup window is shown without taking the focus.
# femtovg over wgpu (Direct3D 12 / Vulkan on Windows, Metal on macOS,
# Vulkan / GL on Linux): over OpenGL animations stuttered on Windows.
# Keep OpenGL available for machines without a Vulkan adapter.
slint = { version = "1.18.1", features = ["unstable-winit-030", "renderer-femtovg-wgpu", "renderer-femtovg"] }
pollster = "0.4.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan"] }
tungstenite = "0.30.0"
ureq = "3.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# notification-area icon: Win32 / AppKit here, D-Bus StatusNotifierItem on
# Linux (no GTK needed)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Slint also uses ksni with async-io; keep a single runtime across the GUI.
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[build-dependencies]
slint-build = "1.18.1"

[features]
# Headless PNG snapshots of the UI for visual review (`cargo run -p lb-gui --example snapshot --features snapshot`).
snapshot = []

[[example]]
name = "snapshot"
required-features = ["snapshot"]
