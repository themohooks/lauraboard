[package]
name = "lb-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png"] }
lb-core = { version = "0.1.0", path = "../lb-core" }
notify-rust = "4.18.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
tungstenite = "0.30.0"
ureq = "3.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

# notification-area icon: Win32 / AppKit here, D-Bus StatusNotifierItem on
# Linux (no GTK needed)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[build-dependencies]
slint-build = "1.18.1"

[features]
# Headless PNG snapshots of the UI for visual review (`cargo run -p lb-gui --example snapshot --features snapshot`).
snapshot = []

[[example]]
name = "snapshot"
required-features = ["snapshot"]
