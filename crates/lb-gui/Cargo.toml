[package]
name = "lb-gui"
version = "0.1.0"
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
lb-core = { version = "0.1.0", path = "../lb-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
ureq = "3.4.2"
