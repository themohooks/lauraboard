name: Set up LauraBoard build environment
description: Install native GUI dependencies, Rust and the Cargo cache
inputs:
  toolchain:
    description: Rust toolchain
    default: '1.96.0'
  cache-key:
    description: Keep incompatible build modes in separate caches
    default: ci
  x86:
    description: Use a native 32-bit Rust host and Linux libraries
    default: 'false'
  desktop:
    description: Install native GUI libraries and reserve memory for Slint
    default: 'true'
  fast-release:
    description: Disable LTO and use 16 codegen units for Actions release builds
    default: 'false'
  components:
    description: Additional Rust components, needed only by the quality job
    default: ''
runs:
  using: composite
  steps:
    - name: Configure standard runner resource usage
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
        X86: ${{ inputs.x86 }}
        FAST_RELEASE: ${{ inputs.fast-release }}
      run: |
        python .github/scripts/ci_resources.py
    - name: Use the primary Ubuntu archive on Linux x64
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        sudo python3 - <<'PY'
        from pathlib import Path
        import re
        apt_root = Path('/etc/apt')
        directory = apt_root / 'sources.list.d'
        sources = [apt_root / 'sources.list', *directory.glob('*.list'), *directory.glob('*.sources')]
        for path in list(sources):
            if not path.is_file():
                continue
            for reference in re.findall(r'mirror\+file:(/\S+)', path.read_text()):
                mirror = Path(reference)
                if mirror.is_file() and mirror.resolve().is_relative_to(apt_root.resolve()):
                    sources.append(mirror)
        for path in sorted(set(sources)):
            if not path.is_file():
                continue
            original = path.read_text()
            updated = re.sub(r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=[/\s]|$)', 'https://archive.ubuntu.com/ubuntu', original)
            if updated != original:
                path.write_text(updated)
                print(f'Using the primary Ubuntu archive in {path}')
        PY
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
      run: |
        sudo timeout --kill-after=30s 10m env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l DESKTOP="$DESKTOP" bash -e <<'APT'
        apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
        apt-get "${apt_options[@]}" update
        packages=(build-essential pkg-config libssl-dev)
        if [[ "$DESKTOP" == true ]]; then
          packages+=(libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev)
        fi
        apt-get "${apt_options[@]}" install --no-install-recommends -y "${packages[@]}"
        APT
    - name: Install Linux x86 build dependencies
      if: runner.os == 'Linux' && inputs.x86 == 'true'
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o Acquire::Retries=2 update
        sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o Acquire::Retries=2 install --no-install-recommends -y \
          gcc-multilib g++-multilib libfontconfig-dev:i386 libxkbcommon-dev:i386 \
          libxkbcommon-x11-dev:i386 libwayland-dev:i386 libgl1-mesa-dev:i386 libssl-dev:i386 libgtk-3-dev:i386 libwebkit2gtk-4.1-dev:i386
        echo 'PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig' >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.x86 }}
        # Workspace outputs are large, and checkout mtimes often invalidate them.
        # Keep the limited free cache for reusable dependency artifacts instead.
        cache-workspace-crates: 'false'
        workspaces: |
          . -> target
          . -> target/server
        cache-on-failure: 'true'
        save-if: ${{ github.event_name != 'pull_request' }}
