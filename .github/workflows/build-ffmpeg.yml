name: Build with FFmpeg
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, linux, windows]
        default: all
      architecture:
        description: Architecture (arm64 is 64-bit ARM)
        type: choice
        options: [all, x64, x86, arm64]
        default: all
      package_format:
        description: Package format (Linux formats require Linux)
        type: choice
        options: [all, setup, portable, server, appimage, debpackage, rpmpackage, aur]
        default: all
      include_ffmpeg:
        description: Include FFmpeg and ffprobe (x64 and ARM64 only)
        type: boolean
        default: true
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      architecture:
        type: string
        default: all
      package_format:
        type: string
        default: all
      include_ffmpeg:
        type: boolean
        default: true
      release_profile:
        description: Publish only AppImage, DEB and RPM for Linux x64 and ARM64
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  plan:
    name: Select architectures and formats
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.matrix.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_ARCHITECTURE: ${{ inputs.architecture }}
          BUILD_FORMAT: ${{ inputs.package_format }}
          BUILD_RELEASE_PROFILE: ${{ inputs.release_profile }}
        run: python3 .github/scripts/build_matrix.py
  build:
    name: Test, build and package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ matrix.toolchain }}
          x86: ${{ matrix.arch == 'x86' }}
          cache-key: native-build
      - name: Prepare bundled FFmpeg
        if: inputs.include_ffmpeg && matrix.arch != 'x86'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_ffmpeg.py
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get install --no-install-recommends -y rpm cpio dpkg-dev patchelf file desktop-file-utils
      - uses: ./.github/actions/test-native
      - name: Reuse the tested offline SWF runtime
        shell: bash
        run: python -c "import shutil; shutil.copytree('target/debug/runtime', 'target/release/runtime', dirs_exist_ok=True)"
      - name: Build and smoke-test installers and portable archives
        run: python .github/scripts/release.py build
      - name: Package every selected format from the local build
        env:
          PACKAGE_FORMATS: ${{ matrix.formats }}
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(matrix.formats), 'setup')
        with:
          name: ${{ matrix.platform }}-setup-${{ matrix.arch }}
          path: target/packages/setup/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(matrix.formats), 'portable')
        with:
          name: ${{ matrix.platform }}-portable-${{ matrix.arch }}
          path: target/packages/portable/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(matrix.formats), 'server')
        with:
          name: ${{ matrix.platform }}-server-${{ matrix.arch }}
          path: target/packages/server/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(matrix.formats), 'appimage')
        with:
          name: ${{ matrix.platform }}-appimage-${{ matrix.arch }}
          path: target/packages/appimage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(matrix.formats), 'debpackage')
        with:
          name: ${{ matrix.platform }}-debpackage-${{ matrix.arch }}
          path: target/packages/debpackage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(matrix.formats), 'rpmpackage')
        with:
          name: ${{ matrix.platform }}-rpmpackage-${{ matrix.arch }}
          path: target/packages/rpmpackage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(matrix.formats), 'aur')
        with:
          name: ${{ matrix.platform }}-aur-${{ matrix.arch }}
          path: target/packages/aur/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
