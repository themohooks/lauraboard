name: Build Linux
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture (arm64 is 64-bit ARM)
        type: choice
        options: [all, x64, x86, arm64]
        default: all
      package_format:
        description: Package format
        type: choice
        options: [all, setup, portable, server, appimage, debpackage, rpmpackage, aur]
        default: all
      include_ffmpeg:
        description: Include FFmpeg and ffprobe in installers and portable archives
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-ffmpeg.yml
    with:
      platform: linux
      architecture: ${{ inputs.architecture }}
      package_format: ${{ inputs.package_format }}
      include_ffmpeg: ${{ inputs.include_ffmpeg }}
