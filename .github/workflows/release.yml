name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check manifest versions and tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 .github/scripts/release.py validate
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      checks_only: true
  audit:
    needs: validate
    uses: ./.github/workflows/security.yml
  build:
    name: Windows and Linux packages
    needs: validate
    uses: ./.github/workflows/build-ffmpeg.yml
    with:
      include_ffmpeg: false
      release_profile: true
  build-macos:
    name: macOS packages
    needs: validate
    uses: ./.github/workflows/build-macos.yml
  publish:
    name: Publish GitHub Release
    needs: [validate, checks, audit, build, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # whole history and tags: the notes list every commit since the previous release
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true
          path: target/release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: target/release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          merge-multiple: true
          path: target/release-assets
      - name: Verify asset set and generate SHA256SUMS
        run: python3 .github/scripts/release.py finalize
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 .github/scripts/release.py notes
          args=(--target "$RELEASE_COMMIT" --notes-file target/release-notes.md --title "LauraBoard ${RELEASE_TAG}")
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            args+=(--verify-tag)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" target/release-assets/*
