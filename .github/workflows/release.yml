name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check manifest versions and tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 .github/scripts/release.py validate
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  audit:
    needs: validate
    uses: ./.github/workflows/security.yml
  build:
    name: Windows and Linux packages
    needs: [validate, checks, audit]
    uses: ./.github/workflows/build-ffmpeg.yml
    with:
      include_ffmpeg: false
      artifact_prefix: release
      release_profile: true
  build-macos:
    name: Build ${{ matrix.target }}
    needs: [validate, checks, audit]
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup
        with:
          cache-key: release-${{ matrix.target }}
      - name: Install native FFmpeg
        run: brew install ffmpeg
      - name: Test native macOS build
        run: cargo test --workspace --locked
      - name: Prepare private web runtime
        run: python .github/scripts/fetch_web_runtime.py --output target/debug/runtime
      - name: Test native HTML and SWF capture
        run: cargo test --locked -p lb-gfx web::tests -- --ignored --test-threads=1
      - name: Build installers and portable archives
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python .github/scripts/release.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish:
    name: Publish GitHub Release
    needs: [validate, build, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # whole history and tags: the notes list every commit since the previous release
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: target/release-assets
      - name: Verify asset set and generate SHA256SUMS
        run: python3 .github/scripts/release.py finalize
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 .github/scripts/release.py notes
          args=(--target "$RELEASE_COMMIT" --notes-file target/release-notes.md --title "LauraBoard ${RELEASE_TAG}")
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            args+=(--verify-tag)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" target/release-assets/*
