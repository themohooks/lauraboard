    "lt-bg",
    "lt-title",
    "lt-sub",
]
opacity = 1.0
layer = 20

[elements.placement]
anchor = "bottom_left"
x = 60.0
y = 110.0
width = 620.0
height = 90.0

[elements.animation]
in = "slide_right"
out = "fade"
duration = "00:00:00.600"

[[elements]]
id = "next-up"
name = "next-up"
type = "text"
text = "Далее: {next_title} в {next_start}"
opacity = 1.0
layer = 20

[elements.style]
size = 28.0
color = "#FFFFFF"
outline_width = 0.0
shadow_color = "#000000A0"
shadow_offset = [
    2.0,
    2.0,
]
background = "#C0182BE0"
padding = 12.0
corner_radius = 6.0

[elements.placement]
anchor = "bottom_right"
x = 60.0
y = 110.0

[elements.animation]
in = "slide_left"
out = "fade"
duration = "00:00:00.500"

[[elements]]
id = "ticker"
name = "ticker"
type = "ticker"
text = "LAURA TV — круглосуточное вещание • {ticker} • Сейчас: {title} • Далее: {next_program} в {next_program_start}"
speed = 110.0
opacity = 1.0
layer = 30

[elements.style]
size = 26.0
color = "#FFFFFF"
outline_width = 0.0
shadow_color = "#000000A0"
shadow_offset = [
    2.0,
    2.0,
]
background = "#000000B0"
padding = 8.0
corner_radius = 0.0

[elements.placement]
anchor = "bottom_left"
x = 0.0
y = 20.0

[elements.animation]
in = "none"
out = "none"
duration = "00:00:00"

[[rules]]
id = "logo"
name = "logo"
enabled = true
element = "logo"
priority = 0

[rules.timing]

[rules.conditions]
kinds = [
    "program",
    "filler",
]

[[rules]]
id = "clock"
name = "clock"
enabled = true
element = "clock"
priority = 0

[rules.timing]

[rules.conditions]
kinds = [
    "program",
    "filler",
]

[[rules]]
