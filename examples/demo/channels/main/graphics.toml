[[layers]]
id = 20
name = "Плашки"
exclusive = true

[[elements]]
id = "logo"
name = "logo"
type = "image"
path = "media/logo.png"
opacity = 0.85
layer = 10

[elements.placement]
anchor = "top_right"
x = 30.0
y = 30.0
width = 160.0

[elements.animation]
in = "none"
out = "none"
duration = "00:00:00"

[[elements]]
id = "clock"
name = "clock"
type = "clock"
format = "%H:%M"
opacity = 1.0
layer = 10

[elements.style]
size = 30.0
color = "#FFFFFF"
outline_width = 0.0
shadow_color = "#000000A0"
shadow_offset = [
    2.0,
    2.0,
]
padding = 12.0
corner_radius = 0.0

[elements.placement]
anchor = "top_left"
x = 30.0
y = 30.0

[elements.animation]
in = "none"
out = "none"
duration = "00:00:00"

[[elements]]
id = "lt-bg"
name = "lt-bg"
type = "rect"
color = "#101828D0"
width = 620.0
height = 90.0
radius = 8.0
opacity = 1.0
layer = 20

[elements.placement]
anchor = "top_left"
x = 0.0
y = 0.0

[elements.animation]
in = "none"
out = "none"
duration = "00:00:00"

[[elements]]
id = "lt-title"
name = "lt-title"
type = "text"
