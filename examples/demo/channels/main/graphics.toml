layer = 20

[elements.style]
size = 22.0
color = "#FFD166"
outline_width = 0.0
shadow_color = "#000000A0"
shadow_offset = [
    2.0,
    2.0,
]
padding = 12.0
corner_radius = 0.0

[elements.placement]
anchor = "top_left"
x = 20.0
y = 52.0

[elements.animation]
in = "none"
out = "none"
duration = "00:00:00"

[[elements]]
id = "lower-third"
name = "lower-third"
type = "group"
